<!-- submited challenges tables -->
<div class="flex flex-col " *ngIf="viewSubmision == false">
    <div class="-mx-4 -my-2 overflow-x-auto sm:-mx-6 lg:-mx-8">
        <div class="inline-block min-w-full py-2 align-middle md:px-6 lg:px-8">
            <div class="overflow-hidden border border-gray-200 dark:border-gray-700 md:rounded-lg">
                <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                    <thead class="bg-gray-50 dark:bg-gray-800">
                        
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200 dark:divide-gray-700 dark:bg-gray-900">
                        
                        <tr *ngFor="let message of messages " (click)="viewSubmison(message.challengeId, message.challengerId)">
                            <td class="px-4 py-4 text-sm font-medium text-gray-700 whitespace-nowrap" >
                                <div class="inline-flex items-center gap-x-3">

                                    <div class="flex items-center gap-x-2">
                                <!-- placeholder profile picture if profile picture not given -->
                                <img *ngIf="message.profilePicture == null" class="w-8 h-8 rounded-full" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png" alt="user photo">
                                <img *ngIf="message.profilePicture != null" class="w-8 h-8 rounded-full" src="{{message.profilePicture}}" alt="user photo">                                        <div>
                                            <h2 class="font-medium text-gray-800 dark:text-white ">{{message.challengerName}}</h2>
                                            <p class="text-sm font-normal text-gray-600 dark:text-gray-400">@{{message.challengerUsername}}</p>
                                        </div>
                                    </div>
                                </div>
                            </td>

                            <td class="px-12 py-4 text-sm font-medium text-gray-700 whitespace-nowrap">
                                {{message.challengeName}} - Submision
                            </td>
                            
                          
                            <td class="px-4 py-4 text-sm whitespace-nowrap">
                               17 June 2020
                            </td>

                            <td class="px-4 py-4 text-sm font-medium text-gray-700 whitespace-nowrap">
                                <div class="inline-flex items-center px-3 py-1 rounded-full gap-x-2 text-emerald-500 bg-emerald-100/60 dark:bg-gray-800" *ngIf="message.challengeStatus == 'Completed'">
                                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M10 3L4.5 8.5L2 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>

                                    <h2 class="text-sm font-normal">Completed</h2>
                                </div>

                                <div *ngIf="message.challengeStatus == 'In Progress'" class="inline-flex items-center px-3 py-1 rounded-full gap-x-2 text-orange-400 bg-orange-100/60 dark:bg-gray-800"  >
                                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M10 3L4.5 8.5L2 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>

                                    <h2 class="text-sm font-normal">Pending </h2>
                                </div>
                            </td>
                        </tr>
                        

                        

                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- View submsion -->
<div class="flex flex-col mt-6 p-4  bg-white" *ngIf="viewSubmision == true" >
    <div>
         <a  (click)="getInbox()">
        <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 1 1 5l4 4"/>
          </svg> 
        </a>
    </div>
    <div class=" relative mt-8 flex items-center gap-x-4">
        <img src="https://images.unsplash.com/photo-1519244703995-f4e0f30006d5?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80" alt="" class="h-10 w-10 rounded-full bg-gray-50">
        <div class="text-sm leading-6">
          <p class="font-semibold text-gray-900">
            <a href="#">
              <span class="absolute inset-0"></span>
              Michael Foster
            </a>
          </p>
          <p class="text-gray-600">Co-Founder / CTO</p>
        </div>
    </div>
    <div>
        
        <h3 class="mt-3 text-xl font-medium  text-gray-600 dark:text-gray-200">Welcome Back</h3>
        <p>27 July 20233</p>
    </div>
    <div class="my-4">
        <img class="w-1/4 rounded-lg h-72"  [src]="submision.image" alt="">
    </div>

    <div class="flex items-center gap-2">
        <button (click)="approve()" class="flex items-center justify-center w-1/2 px-5 py-2 text-sm text-gray-700 transition-colors duration-200 bg-white border border-green-500 rounded-lg gap-x-2 sm:w-auto dark:hover:bg-gray-800 dark:bg-gray-900 hover:bg-green-100 dark:text-gray-200 dark:border-gray-700">
            <svg class="w-5 h-5 text-green-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 16 12">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 5.917 5.724 10.5 15 1.5"/>
              </svg>

            <span>Approve</span>
        </button>

        <button class="flex items-center justify-center w-1/2 px-5 py-2 text-sm text-gray-700 transition-colors duration-200 bg-white border border-red-500 rounded-lg gap-x-2 sm:w-auto dark:hover:bg-gray-800 dark:bg-gray-900 hover:bg-red-100 dark:text-gray-200 dark:border-gray-700">
            <svg class="w-4 h-4 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
              </svg>

            <span>Dissaprove</span>
        </button>
    </div>

      
    
</div>

            <div class="p-3 mx-auto text-blue-500 bg-blue-100 rounded-full dark:bg-gray-800">
                
            </div>
            <h1 class="mt-3 text-lg text-gray-800 dark:text-white">No Submitions</h1>

                Click the "Add function" button to create a function
            </p> -->
            <!-- If the search term is not found -->
            
        </div>
    </div>

</section>
