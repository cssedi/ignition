
<!-- This is the depChall graph. I'm so tired. -->
<section class="container w-full border mt-16 bg-white rounded-lg shadow dark:bg-gray-800 p-4 md:p-6" id="overallChart">
  <div class="flex flex-col">
    <div class="flex justify-between w-full pb-4 mb-4 border-b border-gray-200 dark:border-gray-700">
      <div class="flex items-center">
        <div class="w-12 h-12 rounded-lg bg-gray-100 dark:bg-gray-700 flex items-center justify-center mr-3">
  
          <svg class="w-6 h-6 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
            fill="none" viewBox="0 0 18 16">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M1 1v14h16M4 10l3-4 4 4 5-5m0 0h-3.207M16 5v3.207" />
          </svg>
        </div>
        <div class="flex flex-row w-full">
          <div class="w-2/3">
            <h5 class="leading-none text-2xl font-bold text-gray-900 dark:text-white pb-1">Departmental Participation Report</h5>
            <p class="text-sm font-normal text-gray-500 dark:text-gray-400">
              Participation rates per department.</p>
          </div>
          <div class="w-1/3">
            <button
              class=" flex items-center shadow-md justify-center w-1/2 px-5 py-2 text-sm tracking-wide text-white transition-colors
                  duration-200 bg-blue-700 rounded-lg shrink-0 sm:w-auto gap-x-2 hover:bg-blue-600 dark:hover:bg-blue-500 dark:bg-blue-600" (click)="depChallChartPDF()">
              <svg class="w-4 h-4 text-white dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 16 18">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                  d="M8 1v11m0 0 4-4m-4 4L4 8m11 4v3a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-3" />
              </svg>
              <span>Download</span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <canvas id="depCompletionRates">{{ chart }}</canvas>
  </div>
</section>
