<section class="container px-4 mx-auto">

    <div class="sm:flex sm:items-center sm:justify-between">
        <div>
            <div class="flex items-center gap-x-3">
                <h2 class="text-lg font-medium text-gray-800 dark:text-white">Supplier Order Placed</h2>

                <span class="px-3 py-1 text-xs text-blue-600 bg-blue-100 rounded-full dark:bg-gray-800 dark:text-blue-400"> Orders</span>
            </div>

            <p class="mt-1 text-sm text-gray-500 dark:text-gray-300">
                These companies have purchased in the last 12 months.
            </p>
        </div>
    
        <div class="flex items-center mt-4 gap-x-3">
           
            <button (click)="exportButtonClick()"   class="flex items-center justify-center w-1/2 px-5 py-2 text-sm tracking-wide text-white transition-colors duration-200 bg-blue-500 rounded-lg shrink-0 sm:w-auto gap-x-2 hover:bg-blue-600 dark:hover:bg-blue-500 dark:bg-blue-600">
                <svg class="w-4 h-4 text-white dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 16 18">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M8 1v11m0 0 4-4m-4 4L4 8m11 4v3a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-3"/>
                  </svg>
                <span>Export Data</span>
            </button>
        </div>
    </div>





    <div class="flex flex-col mt-6">
        <div class="-mx-4 -my-2 overflow-x-auto sm:-mx-6 lg:-mx-8">
            <div class="inline-block min-w-full py-2 align-middle md:px-6 lg:px-8">
                <div class="overflow-hidden border border-gray-200 dark:border-gray-700 md:rounded-lg">
                    <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                        <thead class="bg-gray-50 dark:bg-gray-800text-sm font-normal text-left text-gray-800">
                            <tr>
                                <th scope="col" class="px-3 py-3.5 text-left rtl:text-right  dark:text-gray-400">
                                   Supplier Order No.
                                </th>
                                <th scope="col" class="py-3.5 px-4   text-left rtl:text-right dark:text-gray-400">
                                    <div class="flex items-center gap-x-3">
                                        <span>Prizes </span>
                                    </div>
                                </th>

                                

                                <th scope="col" class="px-4 py-3.5 text-left rtl:text-right  dark:text-gray-400">
                                   Status
                                 </th>
                                 
                                <th scope="col" class="px-4 py-3.5  text-left rtl:text-right  dark:text-gray-400">
                                   Date Placed
                                </th>
                                
                                


                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200 dark:divide-gray-700 dark:bg-gray-900">
                            <tr *ngFor="let order of supplierOrders">
                                <td class="px-3 py-4 text-sm font-normal text-gray-700 whitespace-nowrap">
                                    {{order.supplierOrderId}}
                                </td>
                                <td class="px-4 py-4 text-sm font-medium text-gray-700 whitespace-nowrap">
                                     <div class="flex item-center">
                                        <h2 class="font-normal text-gray-800 dark:text-white mx-3 ">{{order.prizeOrders.length}}</h2>
                                        <div class="flex items-center">
                                            <img  class="object-cover w-6 h-6 -mx-1 border-2 border-gray-300 rounded-full dark:border-gray-700 shrink-0" src="{{order.prizeOrders[0].prize.frontImgURL}}" alt="">
                                            <img  class="object-cover w-6 h-6 -mx-1 border-2  border-gray-300 rounded-full dark:border-gray-700 shrink-0" src="{{order.prizeOrders[1].prize.frontImgURL}}" alt="">
                                            <img  class="object-cover w-6 h-6 -mx-1 border-2  border-gray-300 rounded-full dark:border-gray-700 shrink-0" src="{{order.prizeOrders[2].prize.frontImgURL}}" alt="">
                                            <img  class="object-cover w-6 h-6 -mx-1 border-2  border-gray-300 rounded-full dark:border-gray-700 shrink-0" src="{{order.prizeOrders[3].prize.frontImgURL}}" alt="">
                                        </div>
                                    </div> 
                                </td>
                                <td class="px-4 py-4 text-sm text-gray-800 dark:text-gray-300 whitespace-nowrap">
                                    
                                    <span class="px-3 py-1 text-xs text-gray-800 rounded-full dark:bg-gray-800 bg-gray-100/60" >{{order.supplierOrderStatus.name}}</span>  
                                  </td>
  
                                <td class="px-12 py-4 text-sm font-normal text-gray-700 whitespace-nowrap">
                                    {{order.datePlaced}}
                                </td>
                               

                                
                                
                            </tr>
                                                                     
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
   
</section>
