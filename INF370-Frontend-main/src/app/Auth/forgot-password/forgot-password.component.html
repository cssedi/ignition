<!-- Start Reset Password Page -->

<!-- Start reset pasword form -->
<section class=" bg-gradient-to-b from-blue-50 to-transparent dark:from-blue-900 dark:bg-gray-900" *ngIf="emailSent == false">
    <div class="flex items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0 b">
       <div class="flex  border  rounded-lg shadow-md">

        <!-- Start Reset form heading -->
        <div class="w-full p-6 pt-10 bg-white rounded-lg shadow dark:border md:mt-0 sm:max-w-md dark:bg-gray-800 dark:border-gray-700 sm:p-8">
            <h2 class="mb-1 mt-10 text-xl text-center font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white">
                Reset Password
            </h2>
            <!-- End reset form heading -->

            <!-- Start reset password subheading -->
            <p class="mb-1 text-sm text-center font-bold leading-tight tracking-tight text-gray-500 md:text-md dark:text-white">
                Enter your email address and a link will be sent to you to reset your password</p>
            <!-- end reset password subheading     -->
            
            <form class="mt-4 space-y-4 lg:mt-5 md:space-y-5" [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" >

                <div>
                    <label for="email" class="mb2 text-sm font-medium text-gray-900 dark:text-white">Your Email</label>
                    <div class="relative">
                        <!-- start icon code -->
                        <span class="absolute pt-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mx-3  text-gray-300 dark:text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                            </svg>
                        </span>
                        <!-- end icon code -->
                        <input type="email"  placeholder="e.g oscar@email.com" formControlName="email" [ngClass]="{'border-red-500': resetPasswordForm.get('email')?.invalid && resetPasswordForm.get('email')?.touched  || formSubmitted , 'border-gray-400': !resetPasswordForm.get('email')?.invalid || !formSubmitted }" class="block w-full py-3 text-gray-700 bg-white borde border-gray-400 rounded-lg px-11 dark:bg-gray-900 dark:text-gray-300 dark:border-gray-600 focus:border-blue-400 dark:focus:border-blue-300 focus:ring-blue-300 focus:outline-none focus:ring focus:ring-opacity-40" id="brand" class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" id="brand" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" required="">
                        <br>
                        <p class= "mt-[-15px] text-sm text-red-600" *ngIf="resetPasswordForm.get('email')?.invalid && resetPasswordForm.get('email')?.touched && !resetPasswordForm.get('email')?.invalid || formSubmitted" >Your email is required </p>
                    </div>
                </div>
               <!-- start buttons -->
                <button type="submit" class="w-full text-white bg-primary-600 hover:bg-primary-700 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800">Send Email</button>
                 <a href=""></a>
                <button type="button" routerLink="/login" class="w-full text-ba border border-black-400 bg-white hover:bg-red-500 focus:ring-4 focus:outline-none focus:ring-red-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800">Cancel</button>
                <!-- end buttons -->
            </form>
        </div>

        <!-- resetForm image -->
        <div class="w-full bg-white rounded-lg  md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-800 dark:border-gray-700">
            <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
                <img src="https://www.bmwgroup.jobs/content/dam/grpw/websites/bmwgroup_jobs/de/de/de/BMW-Careers-find-out-more-bmw-group-t33.jpg.grp-transform/xxlarge/BMW-Careers-find-out-more-bmw-group-t33.jpg" alt="">
            </div>
        </div>
        <!-- end resetForm image -->
       </div>
        
    </div>
</section>
<!-- End resetPasword form -->


<!-- Email has been sent success modal -->
<section class=" bg-white dark:bg-gray-900" *ngIf="emailSent == true">
    <div class="flex items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0 b">
    
       <div class="flex  items-center border  rounded-lg shadow-md">

        <div class="w-full p-6 pt-10 bg-white rounded-lg   md:mt-0 sm:max-w-md dark:bg-gray-800 dark:border-gray-700 sm:p-8">
           <div  class="items-center text-center">
            <div
            class="w-12 h-12  rounded-full bg-green-100 dark:bg-green-900 p-2 flex items-center justify-center mx-auto mb-3.5">
            <svg aria-hidden="true" class="w-8 h-8 text-green-500 dark:text-green-400" fill="currentColor"
                viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd"
                    d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                    clip-rule="evenodd"></path>
            </svg>
            <span class="sr-only">Success</span>
        </div>
        <p class="mb-1 text-sm text-center font-bold leading-tight tracking-tight text-gray-500 md:text-md dark:text-white">
            We just sent an email to you with a link to reset your password!</p>
        <form class="mt-4 space-y-4 lg:mt-5 md:space-y-5" >
                                        
            <button type="button" routerLink="/login" class="w-full text-white bg-primary-600 hover:bg-primary-700 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800">
                Done
            </button>
             <a href=""></a>
          </form>
           </div>
        </div>

        <div class="w-full bg-white rounded-lg  md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-800 dark:border-gray-700">
            <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
                <img src="https://www.bmwgroup.jobs/content/dam/grpw/websites/bmwgroup_jobs/global/home/BMW-Careers-our-culture-worker-laugh-production.jpg.grp-transform/xxlarge/BMW-Careers-our-culture-worker-laugh-production.jpg"alt="">
            </div>
        </div>
       </div>
        
    </div>
</section>
<!-- End email has been successfully sent code -->
