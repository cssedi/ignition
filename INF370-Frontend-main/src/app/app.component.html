<div *ngIf="reward == false && admin == false ">
   <router-outlet></router-outlet>
</div>

<div *ngIf="admin == true">
   <app-admin-dashboard></app-admin-dashboard>
</div>

<!-- So this will be the universally found help button -->
<!-- Actually, need to put ngIf in here so it only shows when someone is actually logged in. -->
<div class="mr-10 z-0 fixed right-0 bottom-7">
   <button (click)="toggleHelpPopup()" *ngIf="!isHelpPopupVisible"> 
      <svg class="w-12 h-12 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
         fill="none" viewBox="0 0 20 20">
         <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M7.529 7.988a2.502 2.502 0 0 1 5 .191A2.441 2.441 0 0 1 10 10.582V12m-.01 3.008H10M19 10a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
      </svg>
   </button>

   <!-- locationId -->

   <!--  how da h*ck imma get dis right. Maybe a little table?? -->
   <div class="help-popup bg-slate-400" id="help-popup" *ngIf="isHelpPopupVisible">
      <table class="help-table">
         <thead>
            <th>
               Help
            </th>
            <th class="close">
               <button (click)="goToSpecificHelp()">More... &nbsp;</button>
               <span>|</span>
               <button (click)="toggleHelpPopup()">&nbsp; X</button>
            </th>
         </thead>

         <tbody>
            <div *ngFor="let help of helps" (click)="toggleDescription(help)">
               <td>
                  <tr class="help-name">{{ help.name }}</tr>
                  <tr *ngIf="showDescription">{{ help.description }}</tr>
               </td>
               <hr>
               <hr>
            </div>
         </tbody>
      </table>
   </div>
</div>
